replicaCount: 2

image:
  repository: akshat120210/posts
  pullPolicy: IfNotPresent
  tag: v1

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

config:
  NODE_ENV: production

secret:
  APP_SECRET: change-me

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
