apiVersion: v1
kind: Service
metadata:
  name: {{ include "comments.fullname" . }}
  labels:
    {{- include "comments.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "comments.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
