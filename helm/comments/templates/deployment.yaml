apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comments.fullname" . }}
  labels:
    {{- include "comments.labels" . | nindent 4 }}

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "comments.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "comments.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: comments
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "comments.fullname" . }}-config

            - secretRef:
                name: {{ include "comments.fullname" . }}-secret

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
