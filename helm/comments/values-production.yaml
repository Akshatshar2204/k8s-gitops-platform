replicaCount: 2

image:
  repository: akshat120210/comments
  pullPolicy: IfNotPresent
  tag: v1

service:
  type: ClusterIP
  port: 4001
  targetPort: 4001

config:
  NODE_ENV: production

secret:
  APP_SECRET: change-me

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

